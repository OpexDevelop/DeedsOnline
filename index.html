<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DeedsOnline — Circuit CAD & Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e5e5e5;
    color: #222;
    font-family: Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  /* Панель управления */
  #app-bar {
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    z-index: 100;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    background: #f8f6f0;
    padding: 6px 10px;
    border-radius: 6px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.22);
    border: 1px solid #bfbaa8;
    align-items: center;
    max-height: 48vh;
    overflow-y: auto;
  }

  .btn-group {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    border-right: 1px solid #d0ccbc;
    padding-right: 6px;
    margin-right: 2px;
  }
  .btn-group:last-child { border-right: none; }

  button, label.btn {
    background: #eae6d8;
    color: #222;
    border: 1px solid #9c9786;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    box-shadow: inset 0 1px 0 #fff;
    white-space: nowrap;
    touch-action: manipulation;
  }
  button:hover, label.btn:hover { background: #f3f0e6; border-color: #6d695b; }
  button:active, label.btn:active { background: #dad5c3; transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: default; }

  button.active-tool {
    background: #fff8d6 !important;
    border-color: #b8860b !important;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.18) !important;
  }

  #btn-sim-start { color: #007700; }
  #btn-sim-stop { color: #bb0000; }
  .sim-running { background: #d7f0d7 !important; border-color: #27ae60 !important; }

  input[type="file"] { display: none; }
  #info { font-size: 11.5px; color: #555; margin-left: 4px; }

  /* Холст схемы */
  #canvas-container {
    width: 100vw;
    height: 100vh;
    cursor: grab;
    background-color: #ffffff;
    background-image: radial-gradient(#d2d2d2 1.2px, transparent 1.2px);
    background-size: 24px 24px;
    touch-action: none;
  }
  #canvas-container:active { cursor: grabbing; }
  .mode-wire #canvas-container { cursor: crosshair; }
  .mode-delete #canvas-container { cursor: not-allowed; }

  svg { width: 100%; height: 100%; display: block; touch-action: none; }
  .wire { stroke-linecap: square; stroke-linejoin: miter; cursor: pointer; }
  .junction { cursor: pointer; }
  .gate-body { fill: #ffffea; stroke: #000000; stroke-width: 1.8; stroke-linejoin: round; }
  .gate-pin { stroke-linecap: square; }
  .gate-bubble { fill: #ffffea; stroke: #000000; stroke-width: 1.8; }
  .label-title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #600000; text-anchor: middle; }
  .task-num { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #8b0000; }

  .component { cursor: grab; touch-action: none; }
  .component:active { cursor: grabbing; }

  #temp-wire { stroke: #008000; stroke-width: 2; stroke-dasharray: 4 4; pointer-events: none; }
  #snap-cursor { fill: #e74c3c; pointer-events: none; opacity: 0.6; }
</style>
</head>
<body>

<div id="app-bar">
  <!-- Файлы -->
  <div class="btn-group">
    <label class="btn" title="Открыть .pbs или дамп .txt">
      📁 Открыть
      <input type="file" id="file-input">
    </label>
    <button id="btn-save-json" title="Сохранить схему в файл">💾 Сохранить</button>
    <button id="btn-export-png" title="Скачать PNG">📸 PNG</button>
  </div>

  <!-- Симуляция -->
  <div class="btn-group">
    <button id="btn-sim-start">▶ Запуск</button>
    <button id="btn-sim-stop" disabled>⏹ Стоп</button>
  </div>

  <!-- Инструменты -->
  <div class="btn-group">
    <button id="tool-select" class="active-tool" title="Выбор и перемещение">🖐 Выбор</button>
    <button id="tool-wire" title="Чертить провод">✏️ Провод</button>
    <button id="tool-delete" title="Удалить объект">🗑 Удалить</button>
  </div>

  <!-- Элементы -->
  <div class="btn-group">
    <button data-add="INPUT" title="Тумблер">+ Вход</button>
    <button data-add="OUTPUT" title="Индикатор">+ Выход</button>
    <button data-add="NOT">+ NOT</button>
    <button data-add="AND">+ AND</button>
    <button data-add="OR">+ OR</button>
    <button data-add="NAND">+ NAND</button>
    <button data-add="NOR">+ NOR</button>
    <button data-add="XOR">+ XOR</button>
    <button data-add="JUNCTION" title="Узел связи">+ Узел</button>
    <button data-add="LABEL" title="Номер задания">+ Метка</button>
  </div>

  <!-- Экран -->
  <div class="btn-group">
    <button id="btn-fit">📐 Вписать</button>
    <button id="btn-reset-zoom">🔍 100%</button>
    <button id="btn-clear" style="color: #990000;">🧹 Очистить</button>
  </div>

  <span id="info">Схема пуста</span>
</div>

<div id="canvas-container">
  <svg id="schematic-svg" xmlns="http://www.w3.org/2000/svg">
    <defs id="svg-defs"></defs>
    <g id="viewport">
      <g id="wires-layer"></g>
      <g id="components-layer"></g>
      <line id="temp-wire" x1="0" y1="0" x2="0" y2="0" style="display: none;" />
      <circle id="snap-cursor" cx="0" cy="0" r="3.5" style="display: none;" />
    </g>
  </svg>
</div>

<script>
const S = 6.0; // Сетка Deeds = 6px
let circuitData = { elements: [] };
let transform = { x: 40, y: 70, k: 1.0 };
let currentTool = "select"; // "select", "wire", "delete"
let nextObjId = 1000;

// Симуляция
let isSimulating = false;
let inputStates = {};
let outputStates = {};
let netlist = null;
let netValues = {};

// Черчение проводов
let wireStartPoint = null;

// Универсальное управление Pointer Events (ПК + Сенсор)
const activePointers = new Map();
let dragTarget = null;
let dragStartPointer = { x: 0, y: 0 };
let dragOriginalPos = { x: 0, y: 0 };
let dragHasMoved = false;

let isPanning = false;
let panStart = { x: 0, y: 0 };
let pinchInitialDist = 0;
let pinchInitialScale = 1;

const svg = document.getElementById("schematic-svg");
const viewport = document.getElementById("viewport");
const wiresLayer = document.getElementById("wires-layer");
const componentsLayer = document.getElementById("components-layer");
const tempWire = document.getElementById("temp-wire");
const snapCursor = document.getElementById("snap-cursor");
const container = document.getElementById("canvas-container");
const info = document.getElementById("info");
const btnStart = document.getElementById("btn-sim-start");
const btnStop = document.getElementById("btn-sim-stop");

// --- ПАРСЕРЫ ФОРМАТОВ (PBS / XXD / JSON) ---
function parseXXD(text) {
  let bytes = [];
  for (let line of text.split(/\r?\n/)) {
    let m = line.match(/^[0-9a-fA-F]{4,8}:\s+((?:[0-9a-fA-F]{2,4}\s*)+)/);
    if (m) {
      let hex = m[1].replace(/\s+/g, '');
      for (let i = 0; i < hex.length - 1; i += 2) {
        bytes.push(parseInt(hex.substr(i, 2), 16));
      }
    }
  }
  return new Uint8Array(bytes);
}

function parseRawHex(text) {
  let clean = text.replace(/[^0-9a-fA-F]/g, '');
  let bytes = [];
  for (let i = 0; i < clean.length - 1; i += 2) {
    bytes.push(parseInt(clean.substr(i, 2), 16));
  }
  return new Uint8Array(bytes);
}

function parsePBS(buffer) {
  const view = new DataView(buffer.buffer, buffer.byteOffset, buffer.byteLength);
  const elements = [];
  let idx = 0;

  while (idx < buffer.length - 8) {
    if (buffer[idx] === 0xFF && buffer[idx + 1] === 0x0F) break;
    idx++;
  }

  while (idx < buffer.length - 8) {
    if (buffer[idx] === 0xFF && buffer[idx + 1] === 0x0F) {
      let typeCode = view.getUint16(idx + 2, true);
      let objId = view.getUint32(idx + 4, true);
      let pStart = idx + 8;
      
      let nextIdx = buffer.length;
      for (let k = pStart; k < buffer.length - 1; k++) {
        if (buffer[k] === 0xFF && buffer[k + 1] === 0x0F) {
          nextIdx = k;
          break;
        }
      }

      let payloadLen = nextIdx - pStart;
      let elem = { id: objId, typeCode: typeCode };

      if (typeCode === 0x0380 && payloadLen >= 53) {
        elem.type = "WIRE";
        elem.x1 = view.getInt32(pStart + 37, true);
        elem.y1 = view.getInt32(pStart + 41, true);
        elem.x2 = view.getInt32(pStart + 45, true);
        elem.y2 = view.getInt32(pStart + 49, true);
      } 
      else if (typeCode === 0x0390 && payloadLen >= 49) {
        elem.type = "JUNCTION";
        elem.x = view.getInt32(pStart + 41, true);
        elem.y = view.getInt32(pStart + 45, true);
      }
      else if ([0x03B0, 0x03E0, 0x1010, 0x1120, 0x1220, 0x1320, 0x1420, 0x1520, 0x1620, 0x0A00].includes(typeCode) && payloadLen >= 45) {
        elem.x = view.getInt32(pStart + 37, true);
        elem.y = view.getInt32(pStart + 41, true);
        
        if (typeCode === 0x03B0) elem.type = "INPUT";
        else if (typeCode === 0x03E0) elem.type = "OUTPUT";
        else if (typeCode === 0x1010) elem.type = "NOT";
        else if (typeCode === 0x1120) elem.type = "AND";
        else if (typeCode === 0x1220) elem.type = "NAND";
        else if (typeCode === 0x1320) elem.type = "OR";
        else if (typeCode === 0x1420) elem.type = "NOR";
        else if (typeCode === 0x1520) elem.type = "XOR";
        else if (typeCode === 0x1620) elem.type = "XNOR";
        else if (typeCode === 0x0A00) elem.type = "LABEL";

        for (let j = pStart + 45; j < nextIdx - 4; j++) {
          if (view.getUint32(j, true) === 1 && buffer[j+4] >= 32 && buffer[j+4] <= 126) {
            elem.label = String.fromCharCode(buffer[j+4]);
            break;
          }
          if (view.getUint32(j, true) === 4 && buffer[j+5] === 0x00 && buffer[j+7] === 0x00) {
            elem.text = String.fromCharCode(buffer[j+4], buffer[j+6]);
          }
        }
      }

      if (elem.type) elements.push(elem);
      idx = nextIdx;
    } else {
      idx++;
    }
  }
  return { elements };
}

// --- ПРЕОБРАЗОВАНИЕ КООРДИНАТ ---
function screenToGrid(clientX, clientY) {
  const svgP = svg.createSVGPoint();
  svgP.x = clientX;
  svgP.y = clientY;
  const inv = viewport.getScreenCTM().inverse();
  const world = svgP.matrixTransform(inv);
  return {
    gx: Math.round(world.x / S),
    gy: Math.round(world.y / S),
    wx: Math.round(world.x / S) * S,
    wy: Math.round(world.y / S) * S
  };
}

// --- ПОСТРОЕНИЕ СЕТИ ЦЕПЕЙ (NETLIST) ---
function pointTouchesWire(px, py, w) {
  const minX = Math.min(w.x1, w.x2);
  const maxX = Math.max(w.x1, w.x2);
  const minY = Math.min(w.y1, w.y2);
  const maxY = Math.max(w.y1, w.y2);
  if (minX === maxX && px === minX) return py >= minY && py <= maxY;
  if (minY === maxY && py === minY) return px >= minX && px <= maxX;
  return false;
}

function wiresTouch(w1, w2) {
  if (pointTouchesWire(w1.x1, w1.y1, w2) || pointTouchesWire(w1.x2, w1.y2, w2)) return true;
  if (pointTouchesWire(w2.x1, w2.y1, w1) || pointTouchesWire(w2.x2, w2.y2, w1)) return true;
  return false;
}

function buildNetlist(data) {
  const wires = data.elements.filter(e => e.type === "WIRE");
  const junctions = data.elements.filter(e => e.type === "JUNCTION");
  const N = wires.length;

  const parent = Array.from({ length: N }, (_, i) => i);
  function find(i) {
    if (parent[i] === i) return i;
    return (parent[i] = find(parent[i]));
  }
  function union(i, j) {
    const rootI = find(i);
    const rootJ = find(j);
    if (rootI !== rootJ) parent[rootI] = rootJ;
  }

  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      if (wiresTouch(wires[i], wires[j])) union(i, j);
    }
  }

  junctions.forEach(junc => {
    const connected = [];
    wires.forEach((w, idx) => {
      if (pointTouchesWire(junc.x, junc.y, w)) connected.push(idx);
    });
    for (let k = 1; k < connected.length; k++) {
      union(connected[0], connected[k]);
    }
  });

  wires.forEach((w, idx) => { w.netId = find(idx); });
  junctions.forEach(j => {
    const w = wires.find(w => pointTouchesWire(j.x, j.y, w));
    j.netId = w ? find(wires.indexOf(w)) : -1;
  });

  function getPinNet(px, py) {
    const idx = wires.findIndex(w => pointTouchesWire(px, py, w));
    return idx !== -1 ? find(idx) : null;
  }

  const inputs = [], outputs = [], gates = [];

  data.elements.forEach(elem => {
    if (elem.type === "INPUT") {
      elem.outNet = getPinNet(elem.x + 14, elem.y - 4);
      inputs.push(elem);
    } 
    else if (elem.type === "OUTPUT") {
      elem.inNet = getPinNet(elem.x - 6, elem.y - 4);
      outputs.push(elem);
    } 
    else if (elem.type === "NOT") {
      elem.inNet = getPinNet(elem.x - 2, elem.y - 4);
      elem.outNet = getPinNet(elem.x + 10, elem.y - 4);
      gates.push(elem);
    } 
    else if (["AND", "NAND", "OR", "NOR", "XOR", "XNOR"].includes(elem.type)) {
      elem.inNet1 = getPinNet(elem.x - 2, elem.y - 6);
      elem.inNet2 = getPinNet(elem.x - 2, elem.y - 2);
      elem.outNet = getPinNet(elem.x + 14, elem.y - 4);
      gates.push(elem);
    }
  });

  const uniqueNets = [...new Set(wires.map((_, i) => find(i)))];
  return { wires, junctions, inputs, outputs, gates, netIds: uniqueNets };
}

// --- ЛОГИЧЕСКИЙ ДВИЖОК СИМУЛЯТОРА ---
function runSimulation() {
  if (!isSimulating || !netlist) return;

  netValues = {};
  netlist.netIds.forEach(id => { netValues[id] = 0; });

  for (let iter = 0; iter < 40; iter++) {
    let changed = false;

    // Входы
    netlist.inputs.forEach(inp => {
      const val = (inputStates[inp.id] !== undefined) ? inputStates[inp.id] : 0;
      if (inp.outNet !== null && inp.outNet !== undefined) {
        if (netValues[inp.outNet] !== val) {
          netValues[inp.outNet] = val;
          changed = true;
        }
      }
    });

    // Логические вентили
    netlist.gates.forEach(gate => {
      let out = 0;
      if (gate.type === "NOT") {
        const inVal = (gate.inNet !== null && gate.inNet !== undefined) ? (netValues[gate.inNet] || 0) : 0;
        out = (inVal === 1) ? 0 : 1;
      } else {
        const in1 = (gate.inNet1 !== null && gate.inNet1 !== undefined) ? (netValues[gate.inNet1] || 0) : 0;
        const in2 = (gate.inNet2 !== null && gate.inNet2 !== undefined) ? (netValues[gate.inNet2] || 0) : 0;
        if (gate.type === "AND") out = (in1 === 1 && in2 === 1) ? 1 : 0;
        else if (gate.type === "NAND") out = (in1 === 1 && in2 === 1) ? 0 : 1;
        else if (gate.type === "OR") out = (in1 === 1 || in2 === 1) ? 1 : 0;
        else if (gate.type === "NOR") out = (in1 === 1 || in2 === 1) ? 0 : 1;
        else if (gate.type === "XOR") out = (in1 !== in2) ? 1 : 0;
        else if (gate.type === "XNOR") out = (in1 === in2) ? 1 : 0;
      }

      if (gate.outNet !== null && gate.outNet !== undefined) {
        if (netValues[gate.outNet] !== out) {
          netValues[gate.outNet] = out;
          changed = true;
        }
      }
    });

    if (!changed) break;
  }

  // Выходы
  netlist.outputs.forEach(outElem => {
    outputStates[outElem.id] = (outElem.inNet !== null && outElem.inNet !== undefined) ? (netValues[outElem.inNet] || 0) : 0;
  });

  updateVisuals();
}

function updateVisuals() {
  const COLOR_0 = "#0022cc"; // Deeds синий
  const COLOR_1 = "#e00000"; // Deeds красный
  const COLOR_OFF = "#008000"; // Зеленый чертежный

  document.querySelectorAll(".wire").forEach(line => {
    const netId = parseInt(line.dataset.net);
    if (!isSimulating || isNaN(netId) || netId < 0) {
      line.setAttribute("stroke", COLOR_OFF);
      line.setAttribute("stroke-width", "2");
    } else {
      const val = netValues[netId] || 0;
      line.setAttribute("stroke", val === 1 ? COLOR_1 : COLOR_0);
      line.setAttribute("stroke-width", "2.2");
    }
  });

  document.querySelectorAll(".junction").forEach(dot => {
    const netId = parseInt(dot.dataset.net);
    if (!isSimulating || isNaN(netId) || netId < 0) {
      dot.setAttribute("fill", "#000000");
    } else {
      const val = netValues[netId] || 0;
      dot.setAttribute("fill", val === 1 ? COLOR_1 : COLOR_0);
    }
  });

  document.querySelectorAll(".gate-pin").forEach(pin => {
    const netId = parseInt(pin.dataset.net);
    if (!isSimulating || isNaN(netId) || netId < 0) {
      pin.setAttribute("stroke", COLOR_OFF);
      pin.setAttribute("stroke-width", "2");
    } else {
      const val = netValues[netId] || 0;
      pin.setAttribute("stroke", val === 1 ? COLOR_1 : COLOR_0);
      pin.setAttribute("stroke-width", "2.2");
    }
  });

  circuitData.elements.filter(e => e.type === "OUTPUT").forEach(elem => {
    const g = document.querySelector(`.component[data-id="${elem.id}"]`);
    if (g) {
      const txt = g.querySelector(".out-val");
      if (txt) {
        const val = isSimulating ? (outputStates[elem.id] || 0) : 0;
        txt.textContent = val;
        txt.setAttribute("fill", isSimulating && val === 1 ? COLOR_1 : COLOR_0);
      }
    }
  });

  circuitData.elements.filter(e => e.type === "INPUT").forEach(elem => {
    const g = document.querySelector(`.component[data-id="${elem.id}"]`);
    if (g) {
      const val = (inputStates[elem.id] !== undefined) ? inputStates[elem.id] : 0;
      const nY = val === 1 ? -22 : -36;
      const lb = g.querySelector(".lever-body");
      const lh = g.querySelector(".lever-handle");
      const sv = g.querySelector(".sw-val");
      if (lb) lb.setAttribute("y", nY);
      if (lh) lh.setAttribute("y", nY + 8);
      if (sv) sv.textContent = val;
    }
  });
}

// --- ОТРИСОВКА SVG ---
function renderCircuit(data) {
  wiresLayer.innerHTML = "";
  componentsLayer.innerHTML = "";
  if (!data || !data.elements) return;

  netlist = buildNetlist(data);

  // 1. Провода и узлы
  data.elements.forEach(elem => {
    if (elem.type === "WIRE") {
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", elem.x1 * S);
      line.setAttribute("y1", elem.y1 * S);
      line.setAttribute("x2", elem.x2 * S);
      line.setAttribute("y2", elem.y2 * S);
      line.setAttribute("class", "wire");
      line.dataset.id = elem.id;
      line.dataset.net = elem.netId !== undefined ? elem.netId : -1;
      wiresLayer.appendChild(line);
    } 
    else if (elem.type === "JUNCTION") {
      const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("cx", elem.x * S);
      dot.setAttribute("cy", elem.y * S);
      dot.setAttribute("r", 3.2);
      dot.setAttribute("class", "junction");
      dot.dataset.id = elem.id;
      dot.dataset.net = elem.netId !== undefined ? elem.netId : -1;
      wiresLayer.appendChild(dot);
    }
  });

  // 2. Компоненты
  data.elements.forEach(elem => {
    if (["WIRE", "JUNCTION"].includes(elem.type)) return;
    if (typeof elem.x !== "number" || typeof elem.y !== "number") return;

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "component");
    g.setAttribute("transform", `translate(${elem.x * S}, ${elem.y * S})`);
    g.dataset.id = elem.id;

    if (elem.type === "NOT") {
      g.innerHTML = `
        <line x1="-12" y1="-24" x2="6" y2="-24" class="gate-pin" data-net="${elem.inNet ?? -1}" />
        <line x1="52" y1="-24" x2="60" y2="-24" class="gate-pin" data-net="${elem.outNet ?? -1}" />
        <polygon points="6,-42 42,-24 6,-6" class="gate-body" />
        <circle cx="47" cy="-24" r="5" class="gate-bubble" />
      `;
    } 
    else if (elem.type === "AND" || elem.type === "NAND") {
      const isNand = elem.type === "NAND";
      const bubble = isNand ? `<circle cx="55" cy="-24" r="5" class="gate-bubble" />` : "";
      g.innerHTML = `
        <line x1="-12" y1="-36" x2="12" y2="-36" class="gate-pin" data-net="${elem.inNet1 ?? -1}" />
        <line x1="-12" y1="-12" x2="12" y2="-12" class="gate-pin" data-net="${elem.inNet2 ?? -1}" />
        <line x1="60" y1="-24" x2="84" y2="-24" class="gate-pin" data-net="${elem.outNet ?? -1}" />
        <path d="M 12 -48 L 36 -48 A 24 24 0 0 1 36 0 L 12 0 Z" class="gate-body" />
        ${bubble}
      `;
    } 
    else if (elem.type === "OR" || elem.type === "NOR") {
      const isNor = elem.type === "NOR";
      const bubble = isNor ? `<circle cx="65" cy="-24" r="5" class="gate-bubble" />` : "";
      const pinStart = isNor ? 70 : 60;
      g.innerHTML = `
        <line x1="-12" y1="-36" x2="18" y2="-36" class="gate-pin" data-net="${elem.inNet1 ?? -1}" />
        <line x1="-12" y1="-12" x2="18" y2="-12" class="gate-pin" data-net="${elem.inNet2 ?? -1}" />
        <line x1="${pinStart}" y1="-24" x2="84" y2="-24" class="gate-pin" data-net="${elem.outNet ?? -1}" />
        <path d="M 12 -48 Q 24 -24 12 0 Q 36 0 60 -24 Q 36 -48 12 -48 Z" class="gate-body" />
        ${bubble}
      `;
    }
    else if (elem.type === "XOR" || elem.type === "XNOR") {
      const isXnor = elem.type === "XNOR";
      const bubble = isXnor ? `<circle cx="65" cy="-24" r="5" class="gate-bubble" />` : "";
      const pinStart = isXnor ? 70 : 60;
      g.innerHTML = `
        <line x1="-12" y1="-36" x2="18" y2="-36" class="gate-pin" data-net="${elem.inNet1 ?? -1}" />
        <line x1="-12" y1="-12" x2="18" y2="-12" class="gate-pin" data-net="${elem.inNet2 ?? -1}" />
        <line x1="${pinStart}" y1="-24" x2="84" y2="-24" class="gate-pin" data-net="${elem.outNet ?? -1}" />
        <path d="M 6 -48 Q 18 -24 6 0" fill="none" stroke="#000000" stroke-width="1.8" />
        <path d="M 12 -48 Q 24 -24 12 0 Q 36 0 60 -24 Q 36 -48 12 -48 Z" class="gate-body" />
        ${bubble}
      `;
    }
    else if (elem.type === "INPUT") {
      const lbl = elem.label || "In";
      if (inputStates[elem.id] === undefined) inputStates[elem.id] = 0;
      const val = inputStates[elem.id];
      const leverY = val === 1 ? -22 : -36;

      g.innerHTML = `
        <text x="30" y="-53" class="label-title">${lbl}</text>
        <line x1="72" y1="-24" x2="84" y2="-24" class="gate-pin" data-net="${elem.outNet ?? -1}" />
        <rect x="-12" y="-48" width="84" height="48" rx="2" fill="#ece9d8" stroke="#7f7f7f" stroke-width="1.5" />
        <rect x="-6" y="-42" width="28" height="36" fill="#ffffff" stroke="#999" />
        <rect class="lever-body" x="-2" y="${leverY}" width="20" height="14" fill="#333" rx="1" />
        <rect class="lever-handle" x="-3" y="${leverY + 8}" width="22" height="6" fill="#dcd8c8" stroke="#666" />
        <rect x="28" y="-42" width="38" height="36" fill="#ffffff" stroke="#999" />
        <text class="sw-val" x="47" y="-17" font-size="22" font-weight="bold" fill="#c00000" font-family="'Courier New', monospace" text-anchor="middle">${val}</text>
      `;
    } 
    else if (elem.type === "OUTPUT") {
      const lbl = elem.label || "Y";
      g.innerHTML = `
        <text x="0" y="-53" class="label-title">${lbl}</text>
        <line x1="-36" y1="-24" x2="-24" y2="-24" class="gate-pin" data-net="${elem.inNet ?? -1}" />
        <rect x="-24" y="-48" width="48" height="48" rx="2" fill="#ece9d8" stroke="#7f7f7f" stroke-width="1.5" />
        <rect x="-18" y="-42" width="36" height="36" fill="#ffffff" stroke="#666" stroke-width="1.2" />
        <text class="out-val" x="0" y="-17" font-size="24" font-weight="bold" fill="#0000cc" font-family="'Courier New', monospace" text-anchor="middle">0</text>
      `;
    } 
    else if (elem.type === "LABEL") {
      g.innerHTML = `<text x="0" y="16" class="task-num">${elem.text || ""}</text>`;
    }

    componentsLayer.appendChild(g);
  });

  updateTransform();
  updateVisuals();
  info.innerText = `Элементов: ${circuitData.elements.length}`;
}

// --- УНИВЕРСАЛЬНАЯ ОБРАБОТКА POINTER EVENTS (ПК + СМАРТФОН) ---
container.addEventListener("pointerdown", (e) => {
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size === 1) {
    const compG = e.target.closest(".component");
    const wireLine = e.target.closest(".wire");
    const juncDot = e.target.closest(".junction");

    // Инструмент УДАЛЕНИЕ
    if (currentTool === "delete") {
      if (compG) deleteElement(parseInt(compG.dataset.id));
      else if (wireLine) deleteElement(parseInt(wireLine.dataset.id));
      else if (juncDot) deleteElement(parseInt(juncDot.dataset.id));
      return;
    }

    // Инструмент ЧЕРЧЕНИЕ ПРОВОДА
    if (currentTool === "wire") {
      const pt = screenToGrid(e.clientX, e.clientY);
      if (!wireStartPoint) {
        wireStartPoint = { gx: pt.gx, gy: pt.gy, wx: pt.wx, wy: pt.wy };
        tempWire.setAttribute("x1", pt.wx);
        tempWire.setAttribute("y1", pt.wy);
        tempWire.setAttribute("x2", pt.wx);
        tempWire.setAttribute("y2", pt.wy);
        tempWire.style.display = "block";
      } else {
        const x1 = wireStartPoint.gx;
        const y1 = wireStartPoint.gy;
        const x2 = pt.gx;
        const y2 = pt.gy;

        if (x1 !== x2 || y1 !== y2) {
          // Если кликнули по диагонали — создаем два чистых прямоугольных проводника Deeds
          if (x1 !== x2 && y1 !== y2) {
            circuitData.elements.push({ id: nextObjId++, type: "WIRE", x1: x1, y1: y1, x2: x2, y2: y1 });
            circuitData.elements.push({ id: nextObjId++, type: "WIRE", x1: x2, y1: y1, x2: x2, y2: y2 });
          } else {
            circuitData.elements.push({ id: nextObjId++, type: "WIRE", x1: x1, y1: y1, x2: x2, y2: y2 });
          }
          renderCircuit(circuitData);
          if (isSimulating) runSimulation();
        }
        wireStartPoint = null;
        tempWire.style.display = "none";
      }
      return;
    }

    // Инструмент ВЫБОР / ПЕРЕМЕЩЕНИЕ
    if (currentTool === "select" && compG) {
      const id = parseInt(compG.dataset.id);
      const elem = circuitData.elements.find(el => el.id === id);
      if (elem) {
        dragTarget = { elem, g: compG, id };
        dragStartPointer = { x: e.clientX, y: e.clientY };
        dragOriginalPos = { x: elem.x, y: elem.y };
        dragHasMoved = false;
        try { compG.setPointerCapture(e.pointerId); } catch(_) {}
        return;
      }
    }

    // Если кликнули мимо компонентов — панорамирование холста
    isPanning = true;
    panStart.x = e.clientX - transform.x;
    panStart.y = e.clientY - transform.y;
  } 
  // Два пальца на экране — жест Pinch-to-Zoom
  else if (activePointers.size === 2) {
    if (dragTarget) {
      dragTarget.elem.x = dragOriginalPos.x;
      dragTarget.elem.y = dragOriginalPos.y;
      dragTarget.g.setAttribute("transform", `translate(${dragTarget.elem.x * S}, ${dragTarget.elem.y * S})`);
      dragTarget = null;
    }
    isPanning = false;
    const pts = Array.from(activePointers.values());
    pinchInitialDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    pinchInitialScale = transform.k;
  }
});

container.addEventListener("pointermove", (e) => {
  if (activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  // Одиночный указатель
  if (activePointers.size === 1) {
    if (dragTarget) {
      const dist = Math.hypot(e.clientX - dragStartPointer.x, e.clientY - dragStartPointer.y);
      if (dist > 6) dragHasMoved = true;

      if (dragHasMoved) {
        const dx = Math.round((e.clientX - dragStartPointer.x) / (S * transform.k));
        const dy = Math.round((e.clientY - dragStartPointer.y) / (S * transform.k));
        const nx = dragOriginalPos.x + dx;
        const ny = dragOriginalPos.y + dy;
        dragTarget.elem.x = nx;
        dragTarget.elem.y = ny;
        dragTarget.g.setAttribute("transform", `translate(${nx * S}, ${ny * S})`);
      }
      return;
    }

    if (isPanning) {
      transform.x = e.clientX - panStart.x;
      transform.y = e.clientY - panStart.y;
      updateTransform();
      return;
    }

    if (currentTool === "wire") {
      const pt = screenToGrid(e.clientX, e.clientY);
      snapCursor.setAttribute("cx", pt.wx);
      snapCursor.setAttribute("cy", pt.wy);
      snapCursor.style.display = "block";

      if (wireStartPoint) {
        tempWire.setAttribute("x2", pt.wx);
        tempWire.setAttribute("y2", pt.wy);
      }
    }
  } 
  // Сенсорное масштабирование двумя пальцами
  else if (activePointers.size === 2) {
    const pts = Array.from(activePointers.values());
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (pinchInitialDist > 0) {
      const factor = dist / pinchInitialDist;
      const midX = (pts[0].x + pts[1].x) / 2;
      const midY = (pts[0].y + pts[1].y) / 2;
      const newK = Math.max(0.15, Math.min(4.0, pinchInitialScale * factor));
      transform.x = midX - (midX - transform.x) * (newK / transform.k);
      transform.y = midY - (midY - transform.y) * (newK / transform.k);
      transform.k = newK;
      updateTransform();
    }
  }
});

function handlePointerEnd(e) {
  if (dragTarget) {
    try { dragTarget.g.releasePointerCapture(e.pointerId); } catch(_) {}

    // Если пальцем просто тапнули (без сдвига) — это переключение тумблера!
    if (!dragHasMoved) {
      if (dragTarget.elem.type === "INPUT") {
        const id = dragTarget.elem.id;
        inputStates[id] = (inputStates[id] === 1) ? 0 : 1;
        const nVal = inputStates[id];
        const nY = nVal === 1 ? -22 : -36;
        const lb = dragTarget.g.querySelector(".lever-body");
        const lh = dragTarget.g.querySelector(".lever-handle");
        const sv = dragTarget.g.querySelector(".sw-val");
        if (lb) lb.setAttribute("y", nY);
        if (lh) lh.setAttribute("y", nY + 8);
        if (sv) sv.textContent = nVal;

        if (isSimulating) {
          runSimulation();
        }
      }
    } 
    // Если перетаскивали — сохраняем новые координаты и обновляем цепи
    else {
      renderCircuit(circuitData);
      if (isSimulating) runSimulation();
    }
    dragTarget = null;
  }

  isPanning = false;
  activePointers.delete(e.pointerId);
}

container.addEventListener("pointerup", handlePointerEnd);
container.addEventListener("pointercancel", handlePointerEnd);

// Колёсико мыши (ПК)
container.addEventListener("wheel", (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
  const mouseX = e.clientX;
  const mouseY = e.clientY;
  transform.x = mouseX - (mouseX - transform.x) * zoomFactor;
  transform.y = mouseY - (mouseY - transform.y) * zoomFactor;
  transform.k = Math.max(0.15, Math.min(4.0, transform.k * zoomFactor));
  updateTransform();
}, { passive: false });

// --- ПЕРЕКЛЮЧЕНИЕ ИНСТРУМЕНТОВ ---
function setTool(toolName) {
  currentTool = toolName;
  document.querySelectorAll("#app-bar button").forEach(b => b.classList.remove("active-tool"));
  const btn = document.getElementById(`tool-${toolName}`);
  if (btn) btn.classList.add("active-tool");

  document.body.className = `mode-${toolName}`;
  wireStartPoint = null;
  tempWire.style.display = "none";
  snapCursor.style.display = "none";
}

document.getElementById("tool-select").onclick = () => setTool("select");
document.getElementById("tool-wire").onclick = () => setTool("wire");
document.getElementById("tool-delete").onclick = () => setTool("delete");

// Сброс по Escape
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") setTool("select");
});

// --- ДОБАВЛЕНИЕ КОМПОНЕНТОВ ---
document.querySelectorAll("[data-add]").forEach(btn => {
  btn.onclick = () => {
    const type = btn.dataset.add;
    const centerScreen = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    const pt = screenToGrid(centerScreen.x, centerScreen.y);

    let newElem = {
      id: nextObjId++,
      type: type,
      x: pt.gx,
      y: pt.gy
    };

    if (type === "INPUT") {
      const cnt = circuitData.elements.filter(e => e.type === "INPUT").length;
      newElem.label = String.fromCharCode(65 + (cnt % 26));
      inputStates[newElem.id] = 0;
    } else if (type === "OUTPUT") {
      const cnt = circuitData.elements.filter(e => e.type === "OUTPUT").length;
      newElem.label = cnt === 0 ? "Y" : `Y${cnt}`;
    } else if (type === "LABEL") {
      newElem.text = prompt("Текст метки:", "1)") || "1)";
    }

    circuitData.elements.push(newElem);
    setTool("select");
    renderCircuit(circuitData);
    if (isSimulating) runSimulation();
  };
});

function deleteElement(id) {
  circuitData.elements = circuitData.elements.filter(e => e.id !== id);
  renderCircuit(circuitData);
  if (isSimulating) runSimulation();
}

document.getElementById("btn-clear").onclick = () => {
  if (confirm("Очистить всю схему?")) {
    circuitData = { elements: [] };
    wireStartPoint = null;
    renderCircuit(circuitData);
  }
};

// --- УПРАВЛЕНИЕ СИМУЛЯЦИЕЙ ---
btnStart.onclick = () => {
  if (!circuitData || !circuitData.elements || circuitData.elements.length === 0) return;
  isSimulating = true;
  btnStart.disabled = true;
  btnStart.classList.add("sim-running");
  btnStop.disabled = false;
  netlist = buildNetlist(circuitData);
  runSimulation();
};

btnStop.onclick = () => {
  isSimulating = false;
  btnStart.disabled = false;
  btnStart.classList.remove("sim-running");
  btnStop.disabled = true;
  updateVisuals();
};

// --- НАВИГАЦИЯ И МАСШТАБ ---
function updateTransform() {
  if (isNaN(transform.x) || isNaN(transform.y) || isNaN(transform.k)) {
    transform = { x: 40, y: 70, k: 1.0 };
  }
  viewport.setAttribute("transform", `translate(${transform.x}, ${transform.y}) scale(${transform.k})`);
}

function fitToScreen() {
  try {
    const bbox = viewport.getBBox();
    if (!bbox || isNaN(bbox.x) || isNaN(bbox.width) || bbox.width <= 0 || bbox.height <= 0) {
      transform = { x: 40, y: 70, k: 1.0 };
      updateTransform();
      return;
    }
    const pad = 35;
    const cw = window.innerWidth;
    const ch = window.innerHeight;
    const scale = Math.min((cw - pad * 2) / bbox.width, (ch - pad * 2) / bbox.height, 1.2);
    transform.k = Math.max(scale, 0.2);
    transform.x = (cw - bbox.width * transform.k) / 2 - bbox.x * transform.k;
    transform.y = (ch - bbox.height * transform.k) / 2 - bbox.y * transform.k;
    updateTransform();
  } catch (e) {
    transform = { x: 40, y: 70, k: 1.0 };
    updateTransform();
  }
}

document.getElementById("btn-fit").onclick = fitToScreen;
document.getElementById("btn-reset-zoom").onclick = () => {
  transform = { x: 40, y: 70, k: 1.0 };
  updateTransform();
};

// --- СОХРАНЕНИЕ В JSON ---
document.getElementById("btn-save-json").onclick = () => {
  const jsonStr = JSON.stringify(circuitData, null, 2);
  const blob = new Blob([jsonStr], { type: "application/json" });
  const a = document.createElement("a");
  a.download = "deeds_circuit.json";
  a.href = URL.createObjectURL(blob);
  a.click();
};

// --- ЭКСПОРТ В PNG С ПОЛНЫМИ СТИЛЯМИ ---
document.getElementById("btn-export-png").onclick = () => {
  try {
    const bbox = viewport.getBBox();
    const pad = 40;
    const svgW = Math.ceil(bbox.width + pad * 2);
    const svgH = Math.ceil(bbox.height + pad * 2);

    const exportSvg = svg.cloneNode(true);
    exportSvg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    exportSvg.setAttribute("width", svgW);
    exportSvg.setAttribute("height", svgH);
    exportSvg.setAttribute("viewBox", `0 0 ${svgW} ${svgH}`);

    let defs = exportSvg.querySelector("defs");
    if (!defs) {
      defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      exportSvg.insertBefore(defs, exportSvg.firstChild);
    }
    defs.innerHTML = `
      <style>
        .wire { stroke-linecap: square !important; stroke-linejoin: miter !important; fill: none !important; }
        .junction { stroke: none !important; }
        .gate-body { fill: #ffffea !important; stroke: #000000 !important; stroke-width: 1.8 !important; stroke-linejoin: round !important; }
        .gate-pin { stroke-linecap: square !important; fill: none !important; }
        .gate-bubble { fill: #ffffea !important; stroke: #000000 !important; stroke-width: 1.8 !important; }
        .label-title { font-family: Arial, sans-serif !important; font-size: 13px !important; font-weight: bold !important; fill: #600000 !important; text-anchor: middle !important; }
        .task-num { font-family: Arial, sans-serif !important; font-size: 20px !important; font-weight: bold !important; fill: #8b0000 !important; }
      </style>
    `;

    const expVp = exportSvg.getElementById("viewport");
    expVp.setAttribute("transform", `translate(${-bbox.x + pad}, ${-bbox.y + pad}) scale(1)`);
    expVp.querySelector("#temp-wire")?.remove();
    expVp.querySelector("#snap-cursor")?.remove();

    const xml = new XMLSerializer().serializeToString(exportSvg);
    const svgBlob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(svgBlob);

    const img = new Image();
    const canvas = document.createElement("canvas");
    canvas.width = svgW * 2;
    canvas.height = svgH * 2;
    const ctx = canvas.getContext("2d");

    img.onload = () => {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);

      const a = document.createElement("a");
      a.download = isSimulating ? "deeds_circuit_sim.png" : "deeds_circuit.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    };
    img.src = url;
  } catch (err) {
    alert("Ошибка экспорта в PNG: " + err.message);
  }
};

// --- ЗАГРУЗКА (.pbs, .txt, .json) ---
function loadFile(file) {
  const reader = new FileReader();
  reader.onerror = () => alert("Ошибка чтения файла");
  reader.onload = (e) => {
    try {
      const rawBuffer = new Uint8Array(e.target.result);
      if (rawBuffer.length === 0) return alert("Файл пуст");

      let bytes = null;
      if (rawBuffer[0] === 0x1F && rawBuffer[1] === 0x64) {
        bytes = rawBuffer;
      } else {
        const text = new TextDecoder("utf-8").decode(rawBuffer);
        if (text.trim().startsWith("{")) {
          circuitData = JSON.parse(text);
          renderCircuit(circuitData);
          fitToScreen();
          return;
        }
        bytes = parseXXD(text);
        if (!bytes || bytes.length === 0) bytes = parseRawHex(text);
      }

      if (!bytes || bytes.length === 0) return alert("Не удалось распознать формат файла");

      circuitData = parsePBS(bytes);
      isSimulating = false;
      btnStart.disabled = false;
      btnStart.classList.remove("sim-running");
      btnStop.disabled = true;

      renderCircuit(circuitData);
      setTimeout(fitToScreen, 50);
    } catch (err) {
      console.error(err);
      alert("Ошибка при обработке схемы: " + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById("file-input").onchange = (e) => {
  if (e.target.files.length) loadFile(e.target.files[0]);
};

window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => {
  e.preventDefault();
  if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});
